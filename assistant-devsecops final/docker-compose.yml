# =============================================================================
# Assistant DevSecOps — environnement complet
#
#   docker compose up -d --build                        # socle : postgres, backend, IA, frontend
#   docker compose --profile sonar up -d                # + SonarQube
#   docker compose --profile observability up -d        # + Loki, Promtail, Grafana
#
# Interface : http://localhost:4200   (API proxifiée sur /api)
# Variables : copier .env.example en .env et l'adapter.
# =============================================================================
name: assistant-devsecops

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: ${DB_USERNAME:-assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assistant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d assistant"]
      interval: 10s
      timeout: 5s
      retries: 10

  ia-service:
    <<: *restart
    build: ./ia-service
    image: assistant-devsecops-ia:${IMAGE_TAG:-latest}
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ASSISTANT_AI_MODEL: ${ASSISTANT_AI_MODEL:-openai/gpt-oss-120b}
      ASSISTANT_AI_FALLBACK_MODELS: ${ASSISTANT_AI_FALLBACK_MODELS:-llama-3.3-70b-versatile,llama-3.1-8b-instant}
      IA_CORS_ORIGINS: http://localhost:4200
    expose:
      - "8000"
    labels:
      logging: promtail

  backend:
    <<: *restart
    build: ./backend
    image: assistant-devsecops-backend:${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      ia-service:
        condition: service_started
    environment:
      # Fuseau horaire du serveur = celui des utilisateurs : sans cela les conteneurs sont en UTC
      # et l'interface affiche « il y a 1 h » pour un événement qui vient de se produire.
      TZ: ${TZ:-Africa/Tunis}
      DB_URL: jdbc:postgresql://postgres:5432/assistant
      DB_USERNAME: ${DB_USERNAME:-assistant}
      DB_PASSWORD: ${DB_PASSWORD:-assistant}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (32 caractères minimum)}
      CI_API_KEY: ${CI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      AI_SERVICE_URL: http://ia-service:8000
      ASSISTANT_DEMO_ENABLED: ${ASSISTANT_DEMO_ENABLED:-true}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin@2026}
      BOOTSTRAP_QUALITY_PASSWORD: ${BOOTSTRAP_QUALITY_PASSWORD:-Qualite@2026}
      BOOTSTRAP_DEVELOPER_PASSWORD: ${BOOTSTRAP_DEVELOPER_PASSWORD:-Dev@2026}
      SONAR_ENABLED: ${SONAR_ENABLED:-false}
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      TRIVY_IMAGE: assistant-devsecops-backend:${IMAGE_TAG:-latest}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: http://loki:3100
      # Intégration Jira (optionnelle : sans URL ni jeton, mode simulation tracé)
      JIRA_ENABLED: ${JIRA_ENABLED:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_DEPLOYMENT: ${JIRA_DEPLOYMENT:-cloud}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_DEFAULT_PROJECT: ${JIRA_DEFAULT_PROJECT:-}
      JIRA_FOUR_EYES: ${JIRA_FOUR_EYES:-true}
    # Groupe du socket Docker de l'hôte (getent group docker | cut -d: -f3) pour que Trivy
    # puisse scanner les images locales ; sans cela, Trivy scanne les images d'un registre.
    # Linux : GID du groupe docker. Docker Desktop (Windows/macOS) : mettre DOCKER_GID=0 dans .env.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      # Scans Trivy d'images locales via le démon Docker de l'hôte (optionnel)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - maven-repo:/home/assistant/.m2
      - trivy-cache:/home/assistant/.cache/trivy
    expose:
      - "8080"
    ports:
      - "8080:8080"   # API directe + Swagger (http://localhost:8080/swagger-ui.html)
    labels:
      logging: promtail

  frontend:
    <<: *restart
    build: ./frontend
    image: assistant-devsecops-frontend:${IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "4200:80"

  # ---------------------------------------------------------------- profils
  sonarqube:
    <<: *restart
    image: sonarqube:10-community
    profiles: ["sonar"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions

  loki:
    <<: *restart
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    <<: *restart
    image: grafana/promtail:3.1.1
    profiles: ["observability"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    <<: *restart
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki

volumes:
  postgres-data:
  maven-repo:
  trivy-cache:
  sonar-data:
  sonar-extensions:
